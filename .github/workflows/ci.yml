name: CI

# Runs on every push and pull request.
#
# The ordering is deliberate: lint first (seconds, catches syntax errors), then the unit
# suite (a second, no database), then the full suite with a real MySQL service. A failure
# early stops the expensive step.
#
# The full suite takes about six minutes. That number matters: before the test-harness
# fix it was twenty-two, which is why CI was never practical until now. See
# docs/reports/Test-Suite-Performance.md.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './storage/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          echo "All PHP files parse."

  unit:
    name: Unit suite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, mbstring, fileinfo, gd, exif
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        # The unit job used to skip this and failed in one second on both PHP versions: the suite
        # needs a configuration to run at all. Sharing the setup with the full job keeps the two
        # from drifting.
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i "s/^APP_KEY=.*/APP_KEY=$(php -r 'echo bin2hex(random_bytes(32));')/" .env
          mkdir -p storage/cache storage/logs storage/sessions storage/locks public/uploads
          chmod -R 0775 storage public/uploads

      - name: Run the unit suite
        run: php vendor/bin/phpunit --testsuite Unit

  full:
    name: Full suite (PHP 8.3, MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          # The harness refuses to run against a database whose name does not end in
          # `_test` or `_testing`, so the service database is named accordingly.
          MYSQL_DATABASE: line_cms_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, fileinfo, gd, exif
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env

          # Process environment wins over .env, but writing the file keeps the local
          # commands and the test bootstrap in agreement.
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=line_cms_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          sed -i "s/^APP_KEY=.*/APP_KEY=$(php -r 'echo bin2hex(random_bytes(32));')/" .env

          mkdir -p storage/cache storage/logs public/uploads
          chmod -R 0775 storage public/uploads

      - name: Wait for MySQL and create the database
        # No `mysql` or `mysqladmin` client: neither is guaranteed on the runner image, but
        # PHP with pdo_mysql always is, because setup-php just installed it. Waiting in PHP
        # also proves the driver works before anything else runs.
        run: |
          php -r '
            $dsn = "mysql:host=127.0.0.1;port=3306";
            for ($attempt = 1; $attempt <= 30; $attempt++) {
                try {
                    $pdo = new PDO($dsn, "root", "root", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
                    $pdo->exec("CREATE DATABASE IF NOT EXISTS line_cms_test
                        CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");
                    echo "Database ready.\n";
                    exit(0);
                } catch (Throwable $e) {
                    sleep(2);
                }
            }
            fwrite(STDERR, "MySQL did not become ready.\n");
            exit(1);
          '

      - name: Run migrations
        # One invocation applies every pending migration; the runner batches internally.
        run: php bin/migrate.php

      - name: Verify every migration rolls back and re-applies
        # A migration that cannot be undone is a migration nobody dares run in production.
        # Rollback works in batches, so this loops until nothing is left rather than undoing a
        # single batch and calling it proof.
        run: |
          for attempt in $(seq 1 10); do
            output=$(php bin/migrate.php rollback)
            echo "$output"
            echo "$output" | grep -q 'Rolled back 0 migration' && break
          done
          php bin/migrate.php

      - name: Deployment preflight
        run: php bin/doctor.php

      - name: Run the full suite
        # Tee so that a failure keeps its output available in the job log; the second run of a
        # flaky test tells you nothing about the first.
        run: |
          set -o pipefail
          php vendor/bin/phpunit 2>&1 | tee ci-suite.txt

      - name: Report failures
        if: failure()
        run: |
          echo "The suite failed. Reproduce locally with:"
          echo "  php bin/migrate.php && vendor/bin/phpunit --filter 'TheFailingTest'"
