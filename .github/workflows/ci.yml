name: CI

# Runs on every push and pull request.
#
# The ordering is deliberate: lint first (seconds, catches syntax errors), then the unit
# suite (a second, no database), then the full suite with a real MySQL service. A failure
# early stops the expensive step.
#
# The full suite takes about six minutes. That number matters: before the test-harness
# fix it was twenty-two, which is why CI was never practical until now. See
# docs/reports/Test-Suite-Performance.md.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './storage/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          echo "All PHP files parse."

  unit:
    name: Unit suite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, mbstring, fileinfo, gd, exif
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run the unit suite
        run: vendor/bin/phpunit --testsuite Unit

  full:
    name: Full suite (PHP 8.3, MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          # The harness refuses to run against a database whose name does not end in
          # `_test` or `_testing`, so the service database is named accordingly.
          MYSQL_DATABASE: line_cms_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, fileinfo, gd, exif
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env

          # Process environment wins over .env, but writing the file keeps the local
          # commands and the test bootstrap in agreement.
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=line_cms_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          sed -i "s/^APP_KEY=.*/APP_KEY=$(php -r 'echo bin2hex(random_bytes(32));')/" .env

          mkdir -p storage/cache storage/logs public/uploads
          chmod -R 0775 storage public/uploads

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready." >&2
          exit 1

      - name: Create the database
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e 'CREATE DATABASE IF NOT EXISTS line_cms_test
            CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'

      - name: Run migrations
        run: php bin/migrate.php

      - name: Verify migrations roll back
        # A migration that cannot be undone is a migration nobody dares run in production.
        run: |
          php bin/migrate.php rollback
          php bin/migrate.php

      - name: Deployment preflight
        run: php bin/doctor.php

      - name: Run the full suite
        run: vendor/bin/phpunit

      - name: Report failures
        if: failure()
        run: |
          echo "The suite failed. Reproduce locally with:"
          echo "  php bin/migrate.php && vendor/bin/phpunit --filter 'TheFailingTest'"
